[package]
name = "knightos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KnightOS higher-half capability microkernel core"

[dependencies]
knight-abi = { path = "../apps/sdk/abi" }
knightboot-protocol = { path = "../boot/protocol" }
knightos-hal = { path = "hal" }
knightos-cap = { path = "cap" }
knightos-ipc = { path = "ipc" }
knightos-sched = { path = "sched" }
knightos-mm = { path = "../mm" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
knightos-arch-x86_64 = { path = "../arch/x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
knightos-arch-aarch64 = { path = "../arch/aarch64" }
